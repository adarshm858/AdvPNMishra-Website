<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9E79F" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#9A7B1C" />
    </linearGradient>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E223D" />
      <stop offset="100%" stop-color="#050E1A" />
    </linearGradient>
  </defs>
  <!-- Background Shield / Seal -->
  <rect width="64" height="64" rx="14" fill="url(#navyGrad)" />
  <rect x="2" y="2" width="60" height="60" rx="12" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.6" />
  
  <!-- Scales of Justice -->
  <!-- Center Pillar -->
  <line x1="32" y1="14" x2="32" y2="48" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" />
  <!-- Pillar Top Finial -->
  <circle cx="32" cy="13" r="2.5" fill="url(#goldGrad)" />
  <!-- Pillar Base -->
  <path d="M24 48 L40 48 L43 51 L21 51 Z" fill="url(#goldGrad)" />
  
  <!-- Horizontal Balance Beam -->
  <line x1="16" y1="21" x2="48" y2="21" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" />
  <!-- Beam Center Pivot -->
  <circle cx="32" cy="21" r="2" fill="url(#goldGrad)" />
  
  <!-- Left Pan Strings -->
  <line x1="16" y1="21" x2="11" y2="30" stroke="url(#goldGrad)" stroke-width="1" stroke-opacity="0.8" />
  <line x1="16" y1="21" x2="21" y2="30" stroke="url(#goldGrad)" stroke-width="1" stroke-opacity="0.8" />
  <!-- Left Pan -->
  <path d="M10 30 Q16 35 22 30 Z" fill="url(#goldGrad)" />
  
  <!-- Right Pan Strings -->
  <line x1="48" y1="21" x2="43" y2="30" stroke="url(#goldGrad)" stroke-width="1" stroke-opacity="0.8" />
  <line x1="48" y1="21" x2="53" y2="30" stroke="url(#goldGrad)" stroke-width="1" stroke-opacity="0.8" />
  <!-- Right Pan -->
  <path d="M42 30 Q48 35 54 30 Z" fill="url(#goldGrad)" />
</svg>